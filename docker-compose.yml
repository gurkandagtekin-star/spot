services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: markdate
      POSTGRES_PASSWORD: markdate
      POSTGRES_DB: markdate
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markdate -d markdate"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://markdate:markdate@db:5432/markdate
      PGSSL: "0"
      TRUST_PROXY: "1"
    volumes:
      - uploads:/app/server/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
