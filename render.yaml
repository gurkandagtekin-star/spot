databases:
  - name: mark-date-db
    plan: starter

services:
  - type: web
    name: mark-date-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mark-date-db
          property: connectionString
      - key: FORCE_HTTPS
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: PGSSL
        value: "1"
      - key: PORT
        value: "3001"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
